<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="styles.css"/>
  </head>


<body>
  <div class="container">
    <div id="comments-container">
      <ul class="comments" id="comments-list"></ul>
      <div id="comments-loader" class="loader hidden">Загрузка комментариев...</div>
    </div>
    
    <div class="add-form" id="add-form-container">
      <input
        type="text"
        class="add-form-name"
        placeholder="Введите ваше имя"
        id="name-input"
      />
      <textarea
        type="textarea"
        class="add-form-text"
        placeholder="Введите ваш коментарий"
        rows="4"
        id="comment-input"
      ></textarea>
      <div class="add-form-row">
        <button class="add-form-button" id="add-button">Написать</button>
      </div>
    </div>
    <div id="sending-loader" class="sending-loader hidden">Комментарий добавляется...</div>
  </div>

  <script type="module" src="./JS/index.js"></script>
</body>
